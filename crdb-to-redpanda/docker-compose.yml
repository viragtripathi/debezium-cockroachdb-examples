services:
  redpanda:
    image: redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.1}
    hostname: redpanda
    container_name: demo-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:29092
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  cockroachdb:
    image: cockroachdb/cockroach:${COCKROACHDB_VERSION:-v25.4.14}
    hostname: cockroachdb
    container_name: demo-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  cockroachdb-target:
    image: cockroachdb/cockroach:${COCKROACHDB_VERSION:-v25.4.14}
    hostname: cockroachdb-target
    container_name: demo-cockroachdb-target
    command: start-single-node --insecure
    ports:
      - "26258:26257"
      - "8081:8080"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.6.0.Final}
    hostname: connect
    container_name: demo-connect
    depends_on:
      - cockroachdb
      - cockroachdb-target
      - redpanda
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: demo-connect-cluster
      CONFIG_STORAGE_TOPIC: demo-connect-configs
      OFFSET_STORAGE_TOPIC: demo-connect-offsets
      STATUS_STORAGE_TOPIC: demo-connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      LOG_LEVEL: DEBUG
      CONNECT_LOG4J_LOGGER_IO_DEBEZIUM_CONNECTOR_COCKROACHDB: DEBUG
      CONNECT_LOG4J_LOGGER_ORG_APACHE_KAFKA: WARN
    volumes:
      - ./connect-plugins:/kafka/connect/debezium-connector-cockroachdb
      # Shadows the image's bundled 3.6 JDBC sink with the version staged by run-demo.sh,
      # for the CockroachDB dialect and UNNEST batch writes.
      - ./connect-plugins-jdbc/debezium-connector-jdbc:/kafka/connect/debezium-connector-jdbc

networks:
  default:
    name: debezium-demo
