services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: iceberg-demo-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  cockroachdb:
    image: cockroachdb/cockroach:v25.4.18
    container_name: iceberg-demo-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"

  # S3-compatible object store. MinIO's public images were withdrawn from Docker Hub and
  # quay.io in 2025; RustFS speaks the same S3 API on the same ports.
  s3:
    image: rustfs/rustfs:1.0.3
    container_name: iceberg-demo-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_CONSOLE_ENABLE: "true"

  s3-init:
    image: amazon/aws-cli:2.38.5
    container_name: iceberg-demo-s3-init
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://s3:9000 s3api head-bucket --bucket warehouse 2>/dev/null || aws --endpoint-url http://s3:9000 s3 mb s3://warehouse; do sleep 1; done;
      exit 0;
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: iceberg-demo-rest
    depends_on:
      - s3
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.7.0.Final}
    container_name: iceberg-demo-connect
    depends_on:
      - kafka
      - cockroachdb
      - iceberg-rest
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: iceberg-demo-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./connect-plugins/debezium-connector-cockroachdb:/kafka/connect/debezium-connector-cockroachdb
      - ./connect-plugins/iceberg-kafka-connect:/kafka/connect/iceberg-kafka-connect
